# Bundle patch for the dsh-auto-retry plugin: inserts its plugin row into the
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with `dsh plugin --profile web add ./` from the
# plugin folder, or `dsh plugin --profile web add github:<nick>/dsh-auto-retry`.
- insert:
    - id: dsh-auto-retry
      name: 'dsh-auto-retry'
